AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Weather Explorer API - FastAPI on Lambda

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: python3.13

Parameters:
  S3BucketName:
    Type: String
    Default: weather-explorer-vs2026
    Description: Name of the S3 bucket for storing weather data
  AllowedOrigins:
    Type: String
    Default: "https://frontend-six-theta-61.vercel.app,http://localhost:3000"
    Description: Comma-separated CORS origins

Resources:
  WeatherApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.main.handler
      CodeUri: .
      Environment:
        Variables:
          S3_BUCKET_NAME: !Ref S3BucketName
          AWS_REGION_NAME: !Ref AWS::Region
          ALLOWED_ORIGINS: !Ref AllowedOrigins
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref S3BucketName
      Events:
        ApiGateway:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
